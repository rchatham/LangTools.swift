name: PresentationFixtureHost
options:
  bundleIdPrefix: com.reidchatham.pr78fixture
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  LangToolsApp:
    path: ../../../Apps/LangTools
  LangTools:
    path: ../../..
  ChatUI:
    path: ../../../Apps/LangTools/ChatUI

targets:
  PresentationFixtureHost:
    type: application
    platform: iOS
    sources:
      - path: PresentationFixtureHost
      - path: ../../../Apps/LangTools/Tests/ChatTests/Fixtures/RequestErrorPresentationFixture.swift
    dependencies:
      - package: LangToolsApp
        product: Chat
      - package: LangTools
        product: HelperLink
      - package: LangTools
        product: LangTools
      - package: ChatUI
        product: ChatUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reidchatham.pr78fixture.PresentationFixtureHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_TESTABILITY: YES
        ONLY_ACTIVE_ARCH: YES
        # Debug-only fixture: never build a Release configuration for this host.

  PresentationFixtureUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PresentationFixtureUITests
    dependencies:
      - target: PresentationFixtureHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reidchatham.pr78fixture.PresentationFixtureUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PresentationFixtureHost
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ONLY_ACTIVE_ARCH: YES

schemes:
  PresentationFixtureHost:
    build:
      targets:
        PresentationFixtureHost: [run, test, analyze]
        PresentationFixtureUITests: [test]
    test:
      config: Debug
      targets:
        - PresentationFixtureUITests
      commandLineArguments: {}
    run:
      config: Debug
